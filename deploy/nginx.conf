# nginx site for the app. deploy.sh fills in the @PLACEHOLDERS@.
# Serves the built React app and proxies /api/ to gunicorn on the same origin.
server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;

    root @APP_DIR@/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold /api/plan/ waits on several upstream APIs.
        proxy_read_timeout 90s;
        client_max_body_size 2m;
    }

    # MapLibre's worker is an ES module; older nginx mime.types lack .mjs and
    # browsers refuse module scripts served as application/octet-stream.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vite's hashed build assets never change; cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
